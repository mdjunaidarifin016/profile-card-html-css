<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="profile-card">
        <div class="image">
            <img src="myphoto.jpeg" alt="profile image" class="profile-image">
        </div>
        <div class="text-data">
            <span class="name">Md Junaid Arifin</span>
            <span class="job">Coder & Web Developer</span>
        </div>
        <div class="media-buttons">
            <a href="#" class="link" style="background: #4267b2;">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="#" class="link" style="background: #1da1f2;" >
                <i class="fa-brands fa-twitter" ;></i>
            </a>
            <a href="#" class="link"  style="background: #e1306c;">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="#" class="link" style="background: #ff0000;" >
                <i class="fa-brands fa-youtube"></i>
            </a>
        </div>
        <div class="buttons">
            <button class="button">Subscribe</button>
            <button class="button">Mesage</button>
        </div>
        <div class="analytics">
            <div class="data">
                <i class="fa-regular fa-heart"></i>
                <span class="number">60k</span>
            </div>
            <div class="data">
                <i class="fa-regular fa-message"></i>
                <span class="number">20k</span>
            </div>
            <div class="data">
                <i class="fa-solid fa-share"></i>
                <span class="number">12k</span>
            </div>
        </div>
    </div>
</body>

</html>
